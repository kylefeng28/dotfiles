# Rime schema
# encoding: utf-8

schema:
  schema_id: bpmf_py
  name: 注拼
  version: "1.0"
  author:
    - Kyle Feng
  description: |
    Type bopomofo (zhuyin) using pinyin. For example:
    - typing `b` -> "ㄅ", `m` -> "ㄆ", `m` -> "ㄇ", `f` -> "ㄈ"
    - typing `ao` -> "ㄠ", `zhong` -> "ㄓㄨㄥ" which can converted to "中".
    - typing `nihao` -> produces `ㄋㄧˇ ㄏㄠˇ` which can be converted to "你好"

    This is inspired by Japanese romaji keyboards where typing `a` produces あ and typing `watashi` produces "わたし"
    which can be converted to "私".

    Based on rime-bopomofo schema by 佛振 <chen.sst@gmail.com>.
    https://github.com/rime/rime-bopomofo/blob/master/bopomofo.schema.yaml

  dependencies:
    - stroke
    - bopomofo
    - terra_pinyin

switches:
  __include: bopomofo.schema:/switches

engine:
  __include: bopomofo.schema:/engine
  __patch:
    processors/=:
      - ascii_composer
      - recognizer
      - key_binder
      - speller
      - punctuator
      - selector
      - navigator
      - express_editor

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba-;/<,\.'
  initials: zyxwvutsrqponmlkjihgfedcba
  finals: '-;/<,\.'
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
      - __append:
          - derive/^([a-z]+)[0-5]$/$1/
          - 'erase/^.*5$/'
          - 'xlit 1234 -/<\'
          - 'derive/^(.*)-$/$1;/'
          - 'derive/^(.*)<$/$1,/'
          - 'derive/^(.*)\\$/$1./'

translator:
  dictionary: terra_pinyin
  spelling_hints: 10
  always_show_comments: true
  prism: bpmf_py
  enable_completion: true
  preedit_format:
    __include: bpmf_py:/pinyin_to_zhuyin
    __append:
      - 'xform [-;] ˉ'
      - 'xform / ˊ'
      - 'xform [<,] ˇ'
      - 'xform [\\.] ˋ'

  comment_format:
    __include: bpmf_py:/pinyin_to_zhuyin
    __append:
      - xform/(\D+)1/$1ˉ/
      - xform/(\D+)2/$1ˊ/
      - xform/(\D+)3/$1ˇ/
      - xform/(\D+)4/$1ˋ/
      - xform/(\D+)5/$1˙/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

reverse_lookup:
  __include: bopomofo.schema:/reverse_lookup

punctuator:
  __include: bopomofo.schema:/punctuator

editor:
  bindings:
    space: toggle_selection
    Tab: toggle_selection
    Return: commit_comment
    Shift+Return: commit_script_text

key_binder:
  import_preset: default
  bindings:
    - { when: always, accept: Control+Shift+4, toggle: zh_hans }
    - { when: always, accept: Control+Shift+dollar, toggle: zh_hans }
    - { when: always, accept: Control+semicolon, toggle: zh_hans }
    - { when: has_menu, accept: minus, send: minus }  # - for tone 1
    - { when: paging, accept: minus, send: Page_Up }


recognizer:
  import_preset: default
  patterns:
    __include: bopomofo.schema:/recognizer/patterns

zh_hans:
  __include: bopomofo.schema:/zh_hans
zh_hant_tw:
  __include: bopomofo.schema:/zh_hant_tw

__patch:
  # 使用八股文語言模型
  - grammar:/hant?
  # 用家自選配置
  - bpmf_py.custom:/patch?
